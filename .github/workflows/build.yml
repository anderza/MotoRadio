name: Сборка MotoRadio

# APK собирается при каждой загрузке в репозиторий и по кнопке Run workflow на вкладке Actions
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Если в репозиторий загружен архив MotoRadio-Android.zip или папка MotoRadio-Android,
      # а не её содержимое, — достаём проект в корень репозитория
      - name: Подготовить проект
        run: |
          if [ ! -f gradlew ]; then
            # Берём самый свежий загруженный архив проекта: при повторной загрузке с телефона
            # он может называться «MotoRadio-Android.zip (1)» или «MotoRadio-Android (1).zip»
            zip=""; best=0
            for f in MotoRadio-Android*.zip*; do
              [ -f "$f" ] || continue
              t=$(git log -1 --format=%ct -- "$f"); t=${t:-0}
              if [ "$t" -ge "$best" ]; then best=$t; zip=$f; fi
            done
            if [ -n "$zip" ]; then echo "Собираю из архива: $zip"; unzip -q -o "$zip" -d _src; fi
            dir=$(dirname "$(find . -name gradlew -not -path './.git/*' | head -n 1)")
            if [ -z "$dir" ] || [ "$dir" = "." ]; then echo "Не найден gradlew: загрузите проект MotoRadio-Android"; exit 1; fi
            cp -a "$dir"/. .
          fi
          ls -la

      # Обложки станций скачиваются при сборке и встраиваются в приложение — список станций не тормозит
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встроить обложки станций
        run: |
          pip install --quiet pillow
          python3 tools/bundle_covers.py app/src/main/assets/www/index.html || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/MotoRadio-1.0-${{ github.run_number }}.apk

      - name: Выложить APK в Actions
        uses: actions/upload-artifact@v4
        with:
          name: MotoRadio-APK
          path: out/*.apk

      - name: Выложить APK в Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MotoRadio, сборка ${{ github.run_number }}
          files: out/*.apk
