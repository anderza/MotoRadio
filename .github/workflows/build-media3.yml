name: Сборка MotoRadio (Media3)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Собрать APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: MotoRadio-APK
          path: out/*.apk
      - name: Положить APK в ветку apk-build
        run: |
          cd out
          git init -q -b apk-build
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "APK ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-build
