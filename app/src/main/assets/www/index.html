<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#12141c;--panel:#1a1d28;--card:#222636;--line:#2d3247;--tx:#e8eaf3;--mut:#8a90a8;--ac:#2f80ff}
:root[data-theme=light]{--bg:#eef0f6;--panel:#fff;--card:#f4f5fa;--line:#dcdfeb;--tx:#1b1e2b;--mut:#6b7186}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Rubik,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus{border-color:var(--ac)}
#app{flex:1;display:flex;min-height:0}
#rail{width:68px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
#rail .logo{width:40px;height:40px;border-radius:9px;overflow:hidden;background:#000;display:grid;place-items:center;font-weight:600;margin-bottom:10px;color:#fff;font-size:13px}
.nav{width:54px;padding:8px 0;border-radius:10px;font-size:10px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav b{font-size:19px;font-weight:400}
.nav:hover{background:var(--card)}.nav.on{background:var(--card);color:var(--ac)}
main{flex:1;overflow:auto;padding:22px 26px}
h2{font-size:20px;font-weight:600;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.bar input{flex:1;min-width:160px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{padding:8px 14px;border-radius:8px;background:var(--ac);color:#fff;font-weight:500}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
body.compact .grid{grid-template-columns:minmax(0,1fr);gap:4px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.st:hover{border-color:var(--ac)}.st.cur{border-color:var(--ac);background:var(--card)}
.ic{width:42px;height:42px;border-radius:3px;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;position:relative;overflow:hidden}
.ic img,#fp .big img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}
#fp .big{position:relative;overflow:hidden}
#fp .fdash{display:none}
/* большой плеер закрывает нижний: нижний не рисуем и его анимации ставим на паузу (меньше нагрузки на телефоне и ТВ) */
body:has(#fp.on) #player{visibility:hidden}
body:has(#fp.on) #player *,body:has(#fp.on) #player *::before,body:has(#fp.on) #player *::after{animation-play-state:paused!important}
/* раздел «Папки» — музыка с устройства */
.ldh{display:flex;flex-direction:column;gap:10px;margin:4px 0 6px}.ldh small{color:var(--mut);font-size:13px;line-height:1.4}
.ldb{display:flex;flex-wrap:wrap;gap:8px}.ldb .btn{flex:0 1 auto}
[data-mode=phone] .ldb .btn{flex:1 1 0;min-width:0;padding-left:8px;padding-right:8px}
[data-mode=tv] .ldh small{font-size:18px}
.lfl{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.lf{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lfh{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 6px}
.lfo{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:4px;text-align:left;border-radius:8px;background:none;color:var(--tx)}
.lfi{flex:none;width:48px;height:48px;border-radius:6px;overflow:hidden;background:var(--card)}
.lfi img{width:100%;height:100%;object-fit:cover;display:block}
.lfn{min-width:0}.lfn b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lfn small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.lfp,.lfx,.lfc{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;padding:0;background:var(--card);border:1px solid var(--line);color:var(--tx);font-size:14px}
.lfp{background:var(--ac);border-color:var(--ac);color:#fff}
.lfp svg{display:block;width:20px;height:20px}
.lfx:hover{border-color:#d33;color:#f55}
.lft{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ltr{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;text-align:left;background:none;color:var(--tx);border-bottom:1px solid var(--line);border-radius:0}
.ltr:last-child{border-bottom:0}
.ltr:hover,.ltr:focus-visible{background:rgba(128,128,128,.12)}
.ltr.cur{background:color-mix(in srgb,var(--ac) 22%,transparent);color:var(--tx)}
.ltr.cur .lnum{color:var(--ac);font-weight:700}
.lnum{flex:none;width:26px;text-align:right;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.lnm{min-width:0;font-size:14px;line-height:1.3;overflow-wrap:anywhere}.lnm small{display:block;color:var(--mut);font-size:12px}
[data-mode=tv] .lfn b{font-size:22px}[data-mode=tv] .lfn small,[data-mode=tv] .lnm small{font-size:16px}[data-mode=tv] .lnm{font-size:20px}[data-mode=tv] .lfi{width:64px;height:64px}[data-mode=tv] .ltr{padding:12px 16px}

.lg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lg .ic{width:48px;height:48px}
.card-m{max-height:92vh;overflow:auto}
.st .t{flex:1;min-width:0}.st .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .t small{color:var(--mut);font-size:12px}
.fv{font-size:18px;color:var(--mut);padding:4px}.fv.on{color:#ffb020}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.sec-t{margin:20px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ac)}.sw.on::after{left:21px}
.dots{display:flex;gap:8px}.dot{width:24px;height:24px;border-radius:50%;border:2px solid transparent}.dot.on{border-color:var(--tx)}
.msg{color:var(--mut);padding:30px 0;text-align:center;grid-column:1/-1}
#player{background:var(--panel);border-top:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:16px}
#np{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
#np .t{min-width:0}#np .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np small{color:var(--mut);font-size:12px}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px;width:18px}
.eq i{flex:1;background:var(--ac);height:4px;border-radius:1px}
.play .eq i{animation:b .8s ease-in-out infinite alternate}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes b{to{height:16px}}
#ctl{display:flex;align-items:center;gap:6px}
#ctl button{width:36px;height:36px;border-radius:50%;font-size:16px}
#ctl button:hover{background:var(--card)}
#ctl #pp{width:46px;height:46px;background:var(--ac);color:#fff;font-size:18px}
#vol{display:flex;align-items:center;gap:8px;width:170px}
#vol input{flex:1;padding:0;accent-color:var(--ac);background:none;border:0}
#sl{font-size:12px;color:var(--ac);min-width:44px}
#np .ic{cursor:pointer}.ic:hover{filter:brightness(1.15)}
#fp{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;align-items:center;padding:20px 20px 30px;overflow:auto}
#fp.on{display:flex}
#fp .top{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center}
#fp .big{flex:none;width:min(60vw,240px);height:min(60vw,240px);border-radius:28px;display:grid;place-items:center;font-size:0;color:#fff;margin:22px 0 20px;background:transparent;box-shadow:none}
#fp .big.has{box-shadow:0 14px 40px rgba(0,0,0,.35)}
#fp .big img{opacity:0}
#fp .big img.show{opacity:1}
#fp h1{font-size:24px;font-weight:600;text-align:center}
#fp .lbl{color:var(--mut);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:22px}
#fp .trk{font-size:18px;text-align:center;margin-top:6px;max-width:560px;min-height:26px;word-break:break-word}
#fp .vl{display:flex;align-items:center;gap:10px;width:min(100%,320px)}
#fp .vl input{flex:1;padding:0;background:none;border:0;accent-color:var(--ac)}
#pp,#fpp{display:grid;place-items:center;padding:0}
#pp svg,#fpp svg{display:block}
#pp svg{width:22px;height:22px}#fpp svg{width:30px;height:30px}
[data-mode=tv] #pp svg{width:32px;height:32px}
button:focus-visible,.st:focus-visible,.nav:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.st{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.hint{color:var(--mut);font-size:12px;margin:-8px 0 14px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none;align-items:center;justify-content:center;padding:16px}
#md.on{display:flex}
.card-m{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(100%,440px);display:flex;flex-direction:column;gap:12px}
.card-m label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut)}
.card-m input{font-size:15px}
.card-m h2{margin-bottom:2px}
#cm{position:fixed;z-index:40;display:none;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#cm .cmt{padding:6px 10px;font-size:12px;color:var(--mut);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cm button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:7px}

ackground:#07090c}\nbody:not(.hasbg) #bgl{background:radial-gradient(ellipse 70% 50% at 50% -12%,rgba(140,210,255,.16),transparent 70%),radial-gradient(ellipse 120% 70% at 50% 120%,rgba(0,0,0,.7),transparent 60%),url(\"tex/noise7.png\"),#07090c}\nbody:not(.hasbg) #bgl::after{opacity:0}\n:root[data-skin] body.hasbg{background:transparent}\nh2{display:block;font-family:\"Roboto Condensed\",\"Arial Narrow\",\"sans-serif-condensed\",sans-serif;font-weight:700;font-style:italic;letter-spacing:.12em;text-transform:uppercase;color:#f4f8fc;padding-bottom:6px;border-bottom:2px solid #4cc3ff;box-shadow:0 8px 12px -10px rgba(76,195,255,.9)}\n.sec-t{color:#4cc3ff;font-weight:700;font-style:italic;letter-spacing:.16em;text-shadow:0 0 8px rgba(76,195,255,.5)}\n.row{border-bottom:1px solid #1f2329}\n.row small,.hint,.msg,.cpr{color:#8b96a3}\na{color:#7fd4ff}\n\n.btn{background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 50%),linear-gradient(#5fd0ff,#1e8fe0);color:#03121e;border:1px solid #bfe8ff;border-radius:4px;font-weight:800;letter-spacing:.04em;box-shadow:0 0 14px rgba(76,195,255,.45)}\n.btn:hover{filter:brightness(1.1);box-shadow:0 0 20px rgba(76,195,255,.7)}\n.btn.sec{background:linear-gradient(#fdfeff,#b9c3cf 38%,#5d6874 50%,#9aa6b3 62%,#eef3f8);color:#0d1014;border:1px solid #fff;box-shadow:0 1px 0 #000,0 2px 6px rgba(0,0,0,.6)}\n.btn.sec:hover{filter:brightness(1.08)}\n.chip{background:url(\"tex/noise5.png\"),linear-gradient(#1c1f24,#121418);border:1px solid #2e343c;color:#c9d2dc;border-radius:4px;outline:1px dashed rgba(220,230,240,.16);outline-offset:-4px}\n.chip:hover{border-color:#9fb0c2;color:#fff}\n.chip.on{background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 50%),linear-gradient(#5fd0ff,#1e8fe0);color:#03121e;border-color:#bfe8ff;font-weight:800;outline-color:rgba(3,18,30,.35);box-shadow:0 0 12px rgba(76,195,255,.55)}\n.sbtn,.mbtn{background:url(\"tex/noise5.png\"),linear-gradient(#1c1f24,#121418);border:1px solid #2e343c;color:#c9d2d (76,195,255,.45)}\n.btn:hover{filter:brightness(1.1);box-shadow:0 0 20px rgba(76,195,255,.7)}\n.btn.sec{background:linear-gradient(#fdfeff,#b9c3cf 38%,#5d6874 50%,#9aa6b3 62%,#eef3f8);color:#0d1014;border:1px solid #fff;box-shadow:0 1px 0 #000,0 2px 6px rgba(0,0,0,.6)}\n.btn.sec:hover{filter:brightness(1.08)}\n.chip{background:url(\"tex/noise5.png\"),linear-gradient(#1c1f24,#121418);border:1px solid #2e343c;color:#c9d2dc;border-radius:4px;outline:1px dashed rgba(220,230,240,.16);outline-offset:-4px}\n.chip:hover{border-color:#9fb0c2;color:#fff}\n.chip.on{background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 50%),linear-gradient(#5fd0ff,#1e8fe0);color:#03121e;border-color:#bfe8ff;font-weight:800;outline-color:rgba(3,18,30,.35);box-shadow:0 0 12px rgba(76,195,255,.55)}\n.sbtn,.mbtn{background:url(\"tex/noise5.png\"),linear-gradient(#1c1f24,#121418);border:1px solid #2e343c;color:#c9d2dc}\n.sbtn.on,.mbtn.on{background:linear-gradient(#5fd0ff,#1e8fe0);color:#03121e;border-color:#bfe8ff}\n\ninput,select,textarea{background:#0b0d10;color:#eef4fa;border:1px solid #2e343c;border-radius:4px;caret-color:#4cc3ff;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}\ninput:focus,select:focus,textarea:focus{border-color:#4cc3ff;box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 1px #4cc3ff,0 0 12px rgba(76,195,255,.4);outline:none}\ninput::placeholder{color:#566170}\nselect option{background:#0b0d10;color:#eef4fa}\n\n.sw{background:#0b0d10;border:1px solid #3a424c;box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}\n.sw::after{background:linear-gradient(#fdfeff,#b9c3cf 38%,#5d6874 50%,#9aa6b3 62%,#eef3f8)}\n.sw.on{background:#0b2c44;border-color:#4cc3ff;box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 10px rgba(76,195,255,.6)}\n\ninput[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:2px;background:linear-gradient(90deg,#1e6bff,#4cc3ff 55%,#e8f7ff 80%,#ff3b30 86%,#ff3b30);box-shadow:inset 0 1px 2px rgba(0,0,0,.5),0 0 8px rgba(76,195,255,.35)}\ninput[type=range]::-webkit-slider-thumb{width:18px;height:18px;margin-top:-6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9c3cf 55%,#5d6874);border:1px solid #0d1014;box-shadow:0 2px 6px rgba(0,0,0,.7),0 0 8px rgba(76,195,255,.5)}\ninput[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9c3cf 55%,#5d6874);border:1px solid #0d1014}\n\n/* ===== Левая панель: кожа со строчкой ===== */\n#rail{background:url(\"tex/noise5.png\"),linear-gradient(#1c1f24,#121418);border-right:1px solid #3a424c;outline:1px dashed rgba(220,230,240,.14);outline-offset:-6px;box-shadow:inset -1px 0 0 rgba(255,255,255,.05),3px 0 14px rgba(0,0,0,.6)}\n[data-mode=phone] #rail{border-right:0;border-top:1px solid #3a424c}\n.nav{color:#8b96a3;font-weight:600}\n.nav:hover{color:#fff}\n.nav.on{color:#bfe8ff;background:linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,0)),#1d2127;box-shadow:inset 3px 0 0 #4cc3ff,0 0 14px rgba(76,195,255,.2);text-shadow:0 0 8px rgba(76,195,255,.7)}\n[data-mode=phone] .nav.on{box-shadow:inset 0 3px 0 #4cc3ff,0 0 14px rgba(76,195,255,.2)}\n#rail .logo{filter:drop-shadow(0 0 8px rgba(160,220,255,.4))}\n\n/* ===== Станции: кожаные плашки со строчкой, хромовые рамки ===== */\n.st{background:url(\"tex/noise5.png\"),linear-gradient(#1c1f24,#121418);border:1px solid #2a2f36;color:#eef4fa;border-radius:6px;outline:1px solid rgba(220,230,240,.07);outline-offset:-5px}\n.st:hover{border-color:#9fb0c2}\n.st.cur{border-color:#4cc3ff;box-shadow:0 0 16px rgba(76,195,255,.35);outline-color:rgba(76,195,255,.45)}\n.st .t small{color:#8b96a3}\n.ic{box-shadow:0 0 0 1px #9aa6b3}\n.st.tile{border:2px solid #5d6874;border-radius:4px;outline:0;background:#101215;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 3px 0 rgba(0,0,0,.55)}\n.st.tile .ic{box-shadow:none}\n.st.tile:hover{border-color:#c9d2dc}\n.st.tile.cur{border-color:#4cc3ff;box-shadow:0 0 0 1px #000,0 0 22px rgba(76,195,255,.6)}\n.st.tile .t{background:linea 8b96a3;    /* сталь */\n  --ac:#4cc3ff;     /* ксенон */\n}\n\n/* ===== Общее: асфальт и свет фар сверху ===== */\nbody{background:#07090c}\nbody:not(.hasbg) #bgl{background:radial-gradient(ellipse 70% 50% at 50% -12%,rgba(140,210,255,.16),transparent 70%),radial-gradient(ellipse 120% 70% at 50% 120%,rgba(0,0,0,.7),transparent 60%),url(\"tex/noise7.png\"),#07090c}\nbody:not(.hasbg) #bgl::after{opacity:0}\n:root[data-skin] body.hasbg{background:transparent}\nh2{display:block;font-family:\"Roboto Condensed\",\"Arial Narrow\",\"sans-serif-condensed\",sans-serif;font-weight:700;font-style:italic;letter-spacing:.12em;text-transform:uppercase;color:#f4f8fc;padding-bottom:6px;border-bottom:2px solid #4cc3ff;box-shadow:0 8px 12px -10px rgba(76,195,255,.9)}\n.sec-t{color:#4cc3ff;font-weight:700;font-style:italic;letter-spacing:.16em;text-shadow:0 0 8px rgba(76,195,255,.5)}\n.row{border-bottom:1px solid #1f2329}\n.row small,.hint,.msg,.cpr{color:#8b96a3}\na{color:#7fd4ff}\n\n.btn{background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 50%),linear-gradient(#5fd0ff,#1e8fe0);color:#03121e;border:1px solid #bfe8ff;border-radius:4px;font-weight:800;letter-spacing:.04em;box-shadow:0 0 14px rgba(76,195,255,.45)}\n.btn:hover{filter:brightness(1.1);box-shadow:0 0 20px rgba(76,195,255,.7)}\n.btn.sec{background:linear-gradient(#fdfeff,#b9c3cf 38%,#5d6874 50%,#9aa6b3 62%,#eef3f8);color:#0d1014;border:1px solid #fff;box-shadow:0 1px 0 #000,0 2px 6px rgba(0,0,0,.6)}\n.btn.sec:hover{filter:brightness(1.08)}\n.chip{background:url(\"tex/noise5.png\"),linear-gradient(#1c1f24,#121418);border:1px solid #2e343c;color:#c9d2dc;border-radius:4px;outline:1px dashed rgba(220,230,240,.16);outline-offset:-4px}\n.chip:hover{border-color:#9fb0c2;color:#fff}\n.chip.on{background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 50%),linear-gradient(#5fd0ff,#1e8fe0);color:#03121e;border-color:#bfe8ff;font-weight:800;outline-color:rgba(3,18,30,.35);box-shadow:0 0 12px rgba(76,195,255,.55)}\n.sbtn,.mbtn{background:url(\"tex/noise5.png\"),linear-gradient(#1c1f24,#121418);border:1px solid #2e343c;color:#c9d2dc}\n.sbtn.on,.mbtn.on{background:linear-gradient(#5fd0ff,#1e8fe0);color:#03121e;border-color:#bfe8ff}\n\ninput,select,textarea{background:#0b0d10;color:#eef4fa;border:1px solid #2e343c;border-radius:4px;caret-color:#4cc3ff;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}\ninput:focus,select:focus,textarea:focus{border-color:#4cc3ff;box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 1px #4cc3ff,0 0 12px rgba(76,195,255,.4);outline:none}\ninput::placeholder{color:#566170}\nselect option{background:#0b0d10;color:#eef4fa}\n\n.sw{background:#0b0d10;border:1px solid #3a424c;box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}\n.sw::after{background:linear-gradient(#fdfeff,#b9c3cf 38%,#5d6874 50%,#9aa6b3 62%,#eef3f8)}\n.sw.on{background:#0b2c44;border-color:#4cc3ff;box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 10px rgba(76,195,255,.6)}\n\ninput[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:2px;background:linear-gradient(90deg,#1e6bff,#4cc3ff 55%,#e8f7ff 80%,#ff3b30 86%,#ff3b30);box-shadow:inset 0 1px 2px rgba(0,0,0,.5),0 0 8px rgba(76,195,255,.35)}\ninput[type=range]::-webkit-slider-thumb{width:18px;height:18px;margin-top:-6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9c3cf 55%,#5d6874);border:1px solid #0d1014;box-shadow:0 2px 6px rgba(0,0,0,.7),0 0 8px rgba(76,195,255,.5)}\ninput[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9c3cf 55%,#5d6874);border:1px solid #0d1014}\n\n/* ===== Левая панель: кожа со строчкой ===== */\n#rail{background:url(\"tex/noise5.png\"),linear-gradient(#1c1f24,#121418);border-right:1px solid #3a424c;outline:1px dashed rgba(220,230,240,.14);outline-offset:-6px;box-shadow:inset -1px 0 0 rgba(255,255,255,.05),3px 0 14px rgba(0,0,0,.6)}\n[data-mode=phone] #rail{border-right:0;border-top:1px solid #3a424c}\n.nav{color:#8b96a3;   stopMeta();meta="";metaState="load";trk={a:"",t:"",c:"",pv:""};
  if(!S.meta||cur<0)return;
  const idx=cur,st=stations[cur];
  const tick=async()=>{
    let t=null;try{t=await getMeta(st)}catch(e){}
    if(idx!==cur)return;
    const nt=t?t.t:"",ns=t?"ok":"none",img=t?t.img:"";
    if(nt!==meta||metaState!==ns){meta=nt;metaState=ns;const p=parseTrack(nt);trk={a:p.a,t:p.t,c:img||"",pv:img?"":(trk.c||trk.pv||""),s:img||""};coverTry=0;renderNP();updMS();ensureCover();if(ns==="ok")histAdd()}
    else if(img&&trk.c!==img){trk.c=img;trk.s=img;renderNP();updMS()}
    else if(trk.t&&!trk.c&&coverTry<3)ensureCover();
  };
  tick();metaT=setInterval(tick,15000);
}
async function jf(url,ms){
  const c=new AbortController(),to=setTimeout(()=>c.abort(),ms||7000);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(to)}
}
async function icy(url){
  const c=new AbortController();metaCtl=c;const to=setTimeout(()=>c.abort(),9000);
  try{
    const r=await fetch(url,{headers:{"Icy-MetaData":"1"},signal:c.signal});
    const n=+r.headers.get("icy-metaint");if(!n)return null;
    const rd=r.body.getReader();let buf=new Uint8Array(0);
    const need=async k=>{while(buf.length<k){const{value,done}=await rd.read();if(done)return false;const m=new Uint8Array(buf.length+value.length);m.set(buf);m.set(value,buf.length);buf=m}return true};
    let pos=n;
    for(let i=0;i<3;i++){
      if(!await need(pos+1))return null;
      const L=buf[pos]*16;
      if(L){
        if(!await need(pos+1+L))return null;
        const bytes=buf.slice(pos+1,pos+1+L);
        let t=new TextDecoder("utf-8").decode(bytes);
        if(t.includes("\ufffd"))t=new TextDecoder("windows-1251").decode(bytes);
        const m=/StreamTitle='(.*?)';/.exec(t),im=/StreamUrl='(.*?)';/.exec(t);
        const title=m&&m[1].trim();if(!title)return null;
        const img=im&&/^https?:\/\//i.test(im[1])&&isImgUrl(im[1])?im[1]:"";
        return{t:title,img};
      }
      pos+=1+n;
    }
    return null;
  }finally{clearTimeout(to);c.abort()}
}
async function getMeta(s){
  let u;try{u=new URL(s.u)}catch(e){return null}
  const tries=[];
  if(u.hostname.endsWith("somafm.com"))tries.push(async()=>{
    const ch=u.pathname.split("/").pop().split("-")[0];
    const j=await jf("https://somafm.com/songs/"+ch+".json");const x=j.songs&&j.songs[0];
    return x?{t:x.artist+" — "+x.title,img:/^https?:/.test(x.albumart||"")?x.albumart:""}:null});
  if(u.hostname.endsWith("radioparadise.com"))tries.push(async()=>{
    const j=await jf("https://api.radioparadise.com/api/now_playing");
    return j.title?{t:(j.artist?j.artist+" — ":"")+j.title,img:/^https?:/.test(j.cover||"")?j.cover:""}:null});
  const px=x=>"https://api.allorigins.win/raw?url="+encodeURIComponent(x);
  const pj=async x=>{const c=new AbortController(),to=setTimeout(()=>c.abort(),9000);try{const r=await fetch(px(x),{signal:c.signal});if(!r.ok)throw 0;return await r.text()}finally{clearTimeout(to)}};
  if(u.hostname.endsWith("laut.fm"))tries.push(async()=>{
    const name=u.pathname.split("/").filter(Boolean)[0];
    const j=await jf("https://api.laut.fm/station/"+name+"/current_song");
    return j&&j.title?{t:(j.artist&&j.artist.name?j.artist.name+" — ":"")+j.title,img:""}:null});
  if(u.hostname.endsWith("myradio24.com"))tries.push(async()=>{
    const id=u.pathname.split("/").filter(Boolean)[0];
    const j=await jf("https://myradio24.com/users/"+id+"/status.json");
    return j&&j.song?{t:String(j.song),img:/^https?:/.test(j.cover||j.artwork||"")?(j.cover||j.artwork):""}:null});
  tries.push(()=>icy(s.u));
  tries.push(async()=>{
    const j=await jf(u.origin+"/status-json.xsl");let src=j.icestats.source;src=Array.isArray(src)?src:[src];
    const x=src.find(o=>o&&o.listenurl&&o.listenurl.endsWith(u.pathname))||src[0];
    if(!x)return null;
    return x.artist&&x.title?x.artist+" — "+x.title:(x.title||x.yp_currently_playing||null)});
  /* запасные варианты через CORS-прокси (когда сам поток не отдаёт заголовки браузеру) */
  tries.push(async()=>{
    const j=JSON.parse(await pj(u.origin+"/status-json.xsl"));let src=j.icestats.source;src=Array.isArray(src)?src:[src];
    const x=src.find(o=>o&&o.listenurl&&o.listenurl.endsWith(u.pathname))||src[0];
    if(!x)return null;
    return x.artist&&x.title?x.artist+" — "+x.title:(x.title||x.yp_currently_playing||null)});
  tries.push(async()=>{
    const t=await pj(u.origin+"/currentsong?sid=1");
    return t&&t.length<200&&!/<|error|not found/i.test(t)?t:null});
  tries.push(async()=>{
    const t=await pj(u.origin+"/7.html");const m=/<body>([^<]*)<\/body>/i.exec(t);
    if(!m)return null;const p=m[1].split(",");return p.length>6?p.slice(6).join(","):null});
  for(const f of tries){try{let r=await f();if(typeof r==="string")r={t:r,img:""};if(r&&r.t&&r.t.trim())return{t:r.t.trim(),img:r.img||""}}catch(e){}}
  return null;
}





/* ---------- запись потока: «Записать трек» ---------- */
let rec={on:false,key:"",name:"",ext:"mp3",chunks:[],ctl:null};
function recExt(u){const p=u.split("?")[0].toLowerCase();return /\.(aac|aacp)$/.test(p)?"aac":/\.(ogg|opus)$/.test(p)?"ogg":"mp3"}
function recName(){
  const s=stations[cur],t=tk();
  if(t)return(t.a?t.a+" - ":"")+t.t;
  return(s?s.n:"Radio")+" "+new Date().toISOString().slice(0,16).replace("T"," ").replace(":","-");
}
function recUi(){
  document.querySelectorAll("#dl,#fdl").forEach(b=>{b.classList.toggle("rec",rec.on);const sp=b.querySelector("span");if(sp)sp.textContent=rec.on?"Стоп · сохранить":"Записать трек";else b.title=rec.on?"Стоп · сохранить трек":"Записать играющий трек из потока радио"});
}
function toggleRec(){rec.on?stopRec():startRec()}
async function startRec(){
  if(cur<0||!playing){toast("Сначала запустите станцию");return}
  const u=stations[cur].u;
  rec={on:true,key:meta,name:recName(),ext:recExt(u),chunks:[],ctl:null};
  recUi();renderFP();
  toast("Запись: "+rec.name+(tk()?" — остановится в конце трека. Чтобы записать трек целиком, нажимайте в его начале":" — нажмите ещё раз, чтобы сохранить"));
  if(NATIVE){nat("startRecord",u,rec.name,rec.ext);return}
  const c=new AbortController(),mine=rec;rec.ctl=c;
  try{
    const r=await fetch(u,{signal:c.signal});
    if(!r.ok)throw 0;
    const ct=(r.headers.get("content-type")||"").toLowerCase();
    if(/aac|mp4/.test(ct))mine.ext="aac";else if(/ogg|opus/.test(ct))mine.ext="ogg";
    const rd=r.body.getReader();
    for(;;){const{value,done}=await rd.read();if(done)break;mine.chunks.push(value)}
  }catch(e){}
  if(rec!==mine)return;
  finishWebRec();
}
function stopRec(){
  if(!rec.on)return;
  if(NATIVE){nat("stopRecord");return}
  if(rec.ctl)rec.ctl.abort();
}
function finishWebRec(){
  const r=rec;rec={on:false,key:"",name:"",ext:"mp3",chunks:[],ctl:null};
  recUi();renderFP();
  if(!r.chunks.length){toast("Браузер не получил поток: станция не разрешает запись на сайте. В приложении для Android и iPhone запись работает");return}
  const type=r.ext==="aac"?"audio/aac":r.ext==="ogg"?"audio/ogg":"audio/mpeg";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(r.chunks,{type}));
  a.download=r.name.replace(/[\\/:*?"<>|]/g,"_")+"."+r.ext;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("Сохранено: "+a.download);
}
window.nativeRec=function(msg){
  rec={on:false,key:"",name:"",ext:"mp3",chunks:[],ctl:null};
  recUi();renderFP();toast(msg);
};
/* запись заканчивается вместе с треком, паузой или сменой станции */
function recCheck(){
  if(!rec.on)return;
  if(!playing||(rec.key&&meta!==rec.key))stopRec();
}

/* Ссылка (или код «Встроить» с <iframe …>) → {s: сервис, url: ссылка, src: адрес встроенного плеера, alts: запасные адреса}.
   Если встроенного плеера для ссылки нет — {s, url, ext:true, why: причина}: плейлист всё равно добавляется и открывается в самом сервисе.
   Не подошла совсем — null. */
/* VK: владелец, номер плейлиста, код доступа → адрес «vk:владелец_номер_код» для встроенного виджета VK (код — часть ссылки на плейлист).
   Второй домен (@vk.ru) нужен кнопке «Другой плеер»: виджет подключается или с vk.com, или с vk.ru. */
const vkSrc=(o,i,h,d)=>"vk:"+o+"_"+i+"_"+h+(d?"@"+d:"");
function parsePl(raw){
  let u=String(raw||"").trim();
  const vw=u.match(/VK\.Widgets\.Playlist\(\s*['"][^'"]*['"]\s*,\s*(-?\d+)\s*,\s*(\d+)\s*,\s*['"]([A-Za-z0-9]+)['"]/);
  if(vw)return{s:"vk",url:"https://vk.com/music/playlist/"+vw[1]+"_"+vw[2]+"_"+vw[3],src:vkSrc(vw[1],vw[2],vw[3]),alts:[vkSrc(vw[1],vw[2],vw[3],"vk.ru")]};
  const im=u.match(/\bsrc\s*=\s*["']([^"']+)["']/i);
  if(im)u=im[1].replace(/&amp;/g,"&");
  const su=u.match(/^spotify:(playlist|album|track|artist|show|episode):([A-Za-z0-9]+)/);
  if(su)return{s:"sp",url:u,src:"https://open.spotify.com/embed/"+su[1]+"/"+su[2]+"?utm_source=generator&theme=0",alts:[]};
  let x;try{x=new URL(u)}catch(e){return null}
  const host=x.hostname.replace(/^www\./,""),p=x.pathname.split("/").filter(Boolean);
  if(/(^|\.)youtube\.com$|^youtu\.be$|(^|\.)youtube-nocookie\.com$/.test(host)){
    const list=x.searchParams.get("list");
    let v=x.searchParams.get("v")||(host==="youtu.be"?p[0]:"");
    if(!v&&p[0]==="embed"&&p[1]&&p[1]!=="videoseries")v=p[1];
    if(list==="LM")return{s:"yt",url:u,ext:true,why:"Плейлист «Понравившиеся» личный — YouTube не показывает его во встроенном плеере."};
    const mk=h=>{
      const b="https://"+h+"/embed/";
      if(list)return b+(v&&v.length===11?v:"videoseries")+"?list="+encodeURIComponent(list)+"&autoplay=1&rel=0&playsinline=1";
      return v?b+encodeURIComponent(v)+"?autoplay=1&rel=0&playsinline=1":"";
    };
    if(!mk("www.youtube.com"))return null;
    return{s:"yt",url:u,src:mk("www.youtube.com"),alts:[mk("www.youtube-nocookie.com")]};
  }
  if(host==="spotify.link"||host==="spotify.app.link")
    return{s:"sp",url:u,ext:true,why:"Это короткая ссылка Spotify: встроенному плееру нужен полный адрес open.spotify.com/playlist/…"};
  if(/^(open|play|embed)\.spotify\.com$/.test(host)){
    const i=p.findIndex(t=>/^(playlist|album|track|artist|show|episode)$/.test(t));
    if(i>=0&&p[i+1])return{s:"sp",url:u,src:"https://open.spotify.com/embed/"+p[i]+"/"+p[i+1]+"?utm_source=generator&theme=0",alts:[]};
    return null;
  }
  if(/^music\.yandex\.(ru|by|kz|com|uz)$/.test(host)){
    const seg=p.concat(x.hash.replace(/^#!?/,"").split("/").filter(Boolean));
    const g=k=>seg.indexOf(k),us=g("users"),pl=g("playlists"),pz=g("playlist"),al=g("album"),tr=g("track");
    const B="https://music.yandex.ru/iframe/";
    const both=(path)=>({s:"ym",url:u,src:B+path,alts:[B+"#"+path]});
    if(us>=0&&pl>us&&seg[us+1]&&seg[pl+1])return both("playlist/"+seg[us+1]+"/"+seg[pl+1]);
    if(pz>=0&&seg[pz+1]&&seg[pz+2])return both("playlist/"+seg[pz+1]+"/"+seg[pz+2]);
    if(al>=0&&tr>al&&seg[al+1]&&seg[tr+1])return both("track/"+seg[tr+1]+"/"+seg[al+1]);
    if(al<0&&tr>=0&&seg[tr+1]&&seg[tr+2])return both("track/"+seg[tr+1]+"/"+seg[tr+2]);
    if(al>=0&&seg[al+1])return both("album/"+seg[al+1]);
    if(pl>=0&&seg[pl+1])return{s:"ym",url:u,ext:true,why:"Это ссылка нового вида (без имени пользователя) — для неё Яндекс не даёт встроенный плеер. Если в адресной строке браузера у этого плейлиста есть адрес вида …/users/ИМЯ/playlists/НОМЕР, вставьте его."};
    return null;
  }
  if(/^(m\.)?(vk\.(com|ru)|vkontakte\.ru)$/.test(host)||host==="vk.cc"){
    const dc=t=>{try{return decodeURIComponent(t)}catch(e){return t}};
    const q=dc(x.pathname)+" "+dc(x.search)+" "+dc(x.hash);
    /* …/music/playlist/-123_456_код   |   …?z=audio_playlist-123_456/код   |   …audio_playlist123_456&access_hash=код */
    let m=q.match(/\/playlist\/(-?\d+)_(\d+)(?:_([0-9a-f]+))?/i),key="";
    if(m)key=m[3]||"";
    else{
      m=q.match(/audio_playlist(-?\d+)_(\d+)(?:\/([0-9a-f]+))?/i);
      if(m)key=m[3]||(q.match(/[?&](?:access_hash|key)=([0-9a-f]+)/i)||[])[1]||"";
    }
    if(m&&key)return{s:"vk",url:u,src:vkSrc(m[1],m[2],key),alts:[vkSrc(m[1],m[2],key,"vk.ru")]};
    if(m)return{s:"vk",url:u,ext:true,why:"В этой ссылке нет кода доступа плейлиста — без него встроенный плеер VK не открывается. В VK откройте плейлист → ⋯ → «Скопировать ссылку» и вставьте ту ссылку (в ней после номера идёт код из цифр и букв)."};
    if(host==="vk.cc"||/music|audio|playlist|album|artist/.test(q.toLowerCase()))return{s:"vk",url:u,ext:true,quiet:true,why:"Для этой ссылки (альбом, исполнитель или короткая ссылка vk.cc) встроенного плеера нет — она будет открываться в VK. Для плеера нужна полная ссылка на плейлист."};
    return null;
  }
  return null;
}

/* ---------- окно плейлиста: встроенный плеер сервиса + вход в аккаунт ---------- */
let pwI=-1,pwAlt=0,pwLogin=false;
/* VK: официальный виджет «Плейлист» (скрипт vk.com/js/api/openapi.js). Он сам создаёт внутри блока окно плеера VK:
   играют первые 5 треков, остальные — по ссылке в VK. Звук и вход в аккаунт обрабатывает сам VK. */
let vkDom="",vkSeq=0,vkN=0;
function vkLoad(dom){
  return new Promise((ok,fail)=>{
    if(vkDom===dom&&window.VK&&VK.Widgets&&typeof VK.Widgets.Playlist==="function")return ok();
    document.querySelectorAll("script[data-vkapi]").forEach(s=>s.remove());
    try{window.VK=undefined}catch(e){}
    vkDom="";
    const s=document.createElement("script");
    s.dataset.vkapi=dom;
    const t=setTimeout(()=>{s.onload=s.onerror=null;fail(new Error("timeout"))},15000);
    s.onload=()=>{clearTimeout(t);if(window.VK&&VK.Widgets&&typeof VK.Widgets.Playlist==="function"){vkDom=dom;ok()}else fail(new Error("api"))};
    s.onerror=()=>{clearTimeout(t);fail(new Error("net"))};
    s.src="https://"+dom+"/js/api/openapi.js?169";
    document.head.appendChild(s);
  });
}
function vkMsg(slot,t){slot.className="vk";slot.innerHTML="";const d=document.createElement("div");d.className="vkmsg";d.textContent=t;slot.appendChild(d)}
function mountVK(src,slot){
  const m=/^vk:(-?\d+)_(\d+)_([A-Za-z0-9]+)(?:@(vk\.com|vk\.ru))?$/.exec(src||"");
  const my=++vkSeq;
  if(!m){vkMsg(slot,"Не удалось разобрать ссылку плейлиста VK. Удалите плейлист и добавьте его заново: ссылка из «⋯ → Скопировать ссылка».");return}
  vkMsg(slot,"Загружаю плеер VK…");
  vkLoad(m[4]||"vk.com").then(()=>{
    if(my!==vkSeq||!slot.isConnected)return;
    const box=document.createElement("div");
    box.id="vk_playlist_"+m[1]+"_"+m[2]+"_"+(++vkN);
    slot.innerHTML="";slot.className="vk";slot.appendChild(box);
    const w=Math.max(260,Math.min(Math.floor(slot.clientWidth-18),720));
    try{VK.Widgets.Playlist(box.id,+m[1],+m[2],m[3],{width:w})}
    catch(e){vkMsg(slot,"Плеер VK не запустился. Нажмите «Обновить плеер» или «Другой плеер», либо откройте плейлист кнопкой «Открыть в сервисе».");return}
    /* окно плеера, которое создаёт VK, делаем доступным для выбора с пульта/клавиатуры */
    const mo=new MutationObserver(()=>{const f=box.querySelector("iframe");if(f){f.tabIndex=0;mo.disconnect()}});
    mo.observe(box,{childList:true,subtree:true});
    setTimeout(()=>mo.disconnect(),8000);
  }).catch(()=>{
    if(my!==vkSeq||!slot.isConnected)return;
    vkMsg(slot,"Не удалось загрузить плеер VK (нет связи с vk.com или он закрыт для вашей сети). Проверьте интернет и нажмите «Обновить плеер» или «Другой плеер» (он пробует адрес vk.ru). Не помогло — «Открыть в сервисе».");
  });
}
function mkPwFrame(src){
  const f=document.createElement("iframe");

  f.setAttribute("allow","autoplay; encrypted-media; fullscreen; clipboard-write; picture-in-picture");
  f.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
  f.setAttribute("allowfullscreen","");
  f.tabIndex=0;
  f.src=src;
  return f;
}
function mountPW(){
  const p=pls[pwI],slot=$("#pwslot");if(!p||!slot)return;
  let src=pwAlt>0&&(p.alts||[])[pwAlt-1]?p.alts[pwAlt-1]:p.src;
  plcStart(p); /* YouTube и Spotify: нижний плеер приложения управляет плейлистом */
  if(p.s==="yt"){ /* разрешаем управлять плеером YouTube кнопками приложения */
    try{const u=new URL(src);u.searchParams.set("enablejsapi","1");if(/^https?:$/.test(location.protocol))u.searchParams.set("origin",location.origin);src=u.toString()}catch(e){}
  }
  if(p.s==="vk"){mountVK(src,slot);return}
  vkSeq++;slot.className="";slot.innerHTML="";
  if(p.s==="sp"&&plc){mountSP(src,slot,plc.seq);return}

}

    if(NATIVE)t+=" Google не пускает в аккаунт внутри приложений, поэтому закрытые плейлисты YouTube здесь не играют: откройте к плейлисту доступ «по ссылке» или нажмите «Открыть в сервисе».";

/* Управление встроенным плеером YouTube из приложения (прошлый/следующий трек, пуск, пауза) */

/* ---------- нижний плеер приложения управляет плейлистом YouTube / Spotify ----------
   Сами песни играют в официальном плеере сервиса (окно плейлиста), а кнопки нижнего плеера (пуск/пауза, у YouTube ещё
   пред./след.) управляют им через официальные API сервисов: YouTube IFrame Player API и Spotify iFrame API.
   Яндекс Музыка и VK такого управления снаружи не дают — для них всё остаётся в окне плейлиста. */
let plc=null,plcSeq=0;
const plImg=s=>"data:image/svg+xml;utf8,"+encodeURIComponent(plIcon(s).replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" '));
const fmtT=ms=>{const t=Math.max(0,Math.round((+ms||0)/1000));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")};
function loadScript(src,key){
  const m=loadScript.m||(loadScript.m={});
  if(m[key])return m[key];
  return m[key]=new Promise((ok,no)=>{
    const sc=document.createElement("script");
    sc.src=src;sc.async=true;sc.onload=ok;
    sc.onerror=()=>{delete m[key];sc.remove();no(new Error("net"))};
    document.head.appendChild(sc);
    setTimeout(()=>no(new Error("timeout")),12000);
  });
}
function ytApi(){
  if(window.YT&&YT.Player)return Promise.resolve();
  return new Promise((ok,no)=>{
    const prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{try{prev&&prev()}catch(e){}ok()};
    loadScript("https://www.youtube.com/iframe_api","yt").catch(no);
    setTimeout(()=>no(new Error("timeout")),12000);
  });
}
let spApi=null;const spWait=[];
window.onSpotifyIframeApiReady=api=>{spApi=api;spWait.splice(0).forEach(f=>f(api))};
function spLoad(){
  if(spApi)return Promise.resolve(spApi);
  return new Promise((ok,no)=>{
    spWait.push(ok);
    loadScript("https://open.spotify.com/embed/iframe-api/v1","sp").catch(no);
    setTimeout(()=>no(new Error("timeout")),12000);
  });
}
/* начало работы с плейлистом YouTube/Spotify (для остальных сервисов — выход из режима) */
function plcStart(p){
  plcStop(true);
  if(!p||(p.s!=="yt"&&p.s!=="sp"))return;
  plc={kind:p.s,seq:++plcSeq,name:p.n,img:plImg(p.s),cover:"",uri:"",playing:false,title:"",author:"",time:"",prev:p.s==="yt",next:p.s==="yt",ctl:null};
  applyArt();renderNP();
}
function plcStop(quiet){
  if(!plc)return;
  const c=plc.ctl;plc=null;plcSeq++;
  try{if(c&&c.destroy)c.destroy()}catch(e){}
  if(!quiet){applyArt();renderNP()}
}
function plcRender(){
  if(!plc)return;
  $("#pp .cap").innerHTML=plc.playing?PAUSE:PLAY;
  $("#par").textContent=plc.author||plc.name;
  $("#pti").textContent=plc.title||(plc.playing?"Играет плейлист":"Плейлист: "+plc.name);
  $("#ptm").textContent=plc.time||(plc.playing?"[ПЛЕЙЛИСТ]":"[ПАУЗА]");
  $("#pvin").classList.toggle("spin",!!plc.playing);
  $("#prev").classList.toggle("dis",!plc.prev);$("#next").classList.toggle("dis",!plc.next);
}
function plcToggle(){
  if(!plc)return;
  if(plc.kind==="loc"){if(laud.paused){locCtx();laud.play().catch(()=>{})}else laud.pause();return}
  const c=plc.ctl;
  if(plc.kind==="yt"){
    if(c&&c.playVideo&&c.pauseVideo)plc.playing?c.pauseVideo():c.playVideo();
    else{ytCmd(plc.playing?"pauseVideo":"playVideo");plc.playing=!plc.playing;plcRender()}
  }else if(c&&c.togglePlay)c.togglePlay();
  else toast("Управление Spotify отсюда сейчас недоступно — нажмите «play» в плеере выше");
}
function plcStep(d){
  if(!plc)return;
  if(plc.kind==="loc")return locStep(d);
  if(plc.kind!=="yt"){toast("В Spotify треки переключаются в плеере выше, а здесь — пуск и пауза");return}
  const c=plc.ctl;
  if(c&&c.nextVideo&&c.previousVideo)d>0?c.nextVideo():c.previousVideo();
  else ytCmd(d>0?"nextVideo":"previousVideo");
}
function plcYTInfo(){
  const c=plc&&plc.ctl;if(!c||!c.getVideoData)return;
  try{
    const d=c.getVideoData()||{};if(d.title)plc.title=d.title;plc.author=d.author||"";
    const cv=/^[\w-]{6,20}$/.test(d.video_id||"")?"https://i.ytimg.com/vi/"+d.video_id+"/mqdefault.jpg":"";
    if(cv&&cv!==plc.cover){plc.cover=cv;applyArt()}
  }catch(e){}
  try{const i=c.getPlaylistIndex(),l=c.getPlaylist();if(i>=0&&l&&l.length)plc.time="["+(i+1)+" / "+l.length+"]"}catch(e){}
}
function plcYT(f,my){
  ytApi().then(()=>{
    if(!plc||plc.seq!==my||!f.isConnected)return;
    plc.ctl=new YT.Player(f,{events:{
      onReady:()=>{if(plc&&plc.seq===my){plcYTInfo();plcRender()}},
      onStateChange:e=>{

        const d=e.data;
        if(d===1)plc.playing=true;else if(d===0||d===2||d===5||d===-1)plc.playing=false;

      }

  }).catch(()=>{});
}
function plcSpMeta(uri,my){
  const m=/^spotify:track:([A-Za-z0-9]+)$/.exec(uri||"");if(!m)return;
  jf("https://open.spotify.com/oembed?url="+encodeURIComponent("https://open.spotify.com/track/"+m[1]),8000).then(j=>{
    if(!plc||plc.seq!==my||plc.uri!==uri)return;
    plc.title=(j&&j.title)||"";
    plc.cover=/^https:\/\//.test((j&&j.thumbnail_url)||"")?j.thumbnail_url:"";

function mountSP(src,slot,my){
  const m=/\/embed\/(playlist|album|track|artist|show|episode)\/([A-Za-z0-9]+)/.exec(src||"");

/* окно плейлиста YouTube/Spotify заканчивается над нижним плеером, чтобы он оставался на виду (если экран не слишком низкий) */

/* ---------- полноэкранный проигрыватель ---------- */

/* ===== Раздел «Папки»: музыка с устройства =====

const IMGX=/\.(png|jpe?g|webp|gif|svg|ico|avif|bmp)(?:[?#]|$)/i,IMGW=/(logo|favicon|icon|cover|artwork|image|img|thumb|avatar)/i,AUDX=/\.(mp3|aacp?|ogg|opus|m3u8?|pls)(?:[?#;]|$)/i;
const isImgUrl=u=>IMGX.test(u)||(IMGW.test(u.replace(/^https?:\/\/[^/]+/i,""))&&!AUDX.test(u));
function parseTxt(t){
  const out=[];let pn="",pl="",pg="";
  t.replace(/^\uFEFF/,"").split(/\r?\n/).forEach(raw=>{
    const l=raw.trim();if(!l)return;
    if(l.startsWith("#")){
      if(l.startsWith("#EXTINF")){
        const c=l.lastIndexOf(",");pn=c>=0?l.slice(c+1).trim():"";
        const m1=/tvg-logo="([^"]*)"/i.exec(l),m2=/group-title="([^"]*)"/i.exec(l);
        pl=m1?m1[1]:"";pg=m2?m2[1]:"";
      }
      return;
    }
    const urls=l.match(/https?:\/\/[^\s|;,"'<>]+/g);if(!urls)return;
    const imgs=urls.filter(isImgUrl),non=urls.filter(u=>!isImgUrl(u));
    let su,lg="";
    if(non.length){su=non[0];lg=imgs[0]||non[1]||""}else{su=urls[0];lg=urls[1]||""}
    if(!lg&&/^https?:/i.test(pl))lg=pl;
    const txt=l.replace(/https?:\/\/[^\s|;,"'<>]+/g,"\u0001");
    const sep=/[|;\t]/.test(txt)?/\s*[|;\t]\s*/:/\s*,\s*/;
    let parts=txt.split(sep).map(x=>x.replace(/\u0001/g,"").replace(/^[\s:=\-–—]+|[\s:=\-–—]+$/g,"")).filter(Boolean);
    /* ссылка на лого без http (covers/…, www.…/x.png, data:image…) — это логотип, а не жанр */
    const pathy=x=>/^data:image\//i.test(x)||/^(www\.|\/\/)/i.test(x)||(/[\/\\]/.test(x)&&IMGX.test(x))||(!/\s/.test(x)&&IMGX.test(x));
    const pl2=parts.slice(1).filter(pathy);parts=[parts[0],...parts.slice(1).filter(x=>!pathy(x))].filter(Boolean);
    /* лого берём только по ссылке, которую приложение может открыть; пути к файлам другого приложения (logos/p000.webp) пропускаем —
       тогда лого найдётся само (Radio Browser) */
    const okL=pl2.find(x=>/^(www\.|\/\/|data:image\/|covers\/)/i.test(x));
    if(!lg&&okL)lg=/^(www\.)/i.test(okL)?"https://"+okL:/^\/\//.test(okL)?"https:"+okL:okL;
    out.push({n:parts[0]||pn||su.replace(/^https?:\/\//,"").split("/")[0],u:su,g:parts[1]||pg||"",l:lg});
    pn=pl=pg="";
  });
  return out;
}
function openExt(u){if(NATIVE)nat("openUrl",u);else window.open(u,"_blank","noopener")}
function exportTxt(){
  /* лого — только ссылкой из интернета: встроенные обложки (covers/…) выгружаются исходной ссылкой, иначе не пишутся,
     а жанр, похожий на ссылку, не выгружается */
  const lines=stations.map(s=>{const lg=/^https?:\/\//i.test(s.l||"")?s.l:/^https?:\/\//i.test(s.o||"")?s.o:"";
    const a=[s.n,s.u,/^https?:|^www\.|\.(png|jpe?g|webp|gif|svg)\b/i.test(s.g||"")?"":(s.g||"")];if(lg)a.push(lg);while(a.length>2&&!a[a.length-1])a.pop();return a.join(" | ")});
  if(NATIVE){nat("saveText","MotoRadio Station.txt",lines.join("\n")+"\n");return}
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([lines.join("\n")+"\n"],{type:"text/plain;charset=utf-8"}));
  a.download="MotoRadio Station.txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

/* ---------- логотипы станций из каталога Radio Browser ---------- */
const RB=["https://de1.api.radio-browser.info","https://fi1.api.radio-browser.info","https://nl1.api.radio-browser.info"];
let rbHost=0,noLg=new Set(load("nolg",[])),lgBusy=false,lgMsg="";
async function rb(path){
  for(let k=0;k<RB.length;k++){
    const h=(rbHost+k)%RB.length;
    try{const j=await jf(RB[h]+path,8000);rbHost=h;return j}catch(e){}
  }
  throw new Error("radio-browser недоступен");
}
const nrm=x=>(x||"").toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"");
async function findLogo(s){
  const ok=x=>x&&/^https?:\/\//i.test(x.favicon||"")?x.favicon:"";
  /* станции laut.fm: картинка есть у каждой, берём её прямо из их каталога */
  const lm=/^https?:\/\/(?:([a-z0-9-]+)\.stream\.laut\.fm|stream\.laut\.fm)\/([a-z0-9_-]+)/i.exec(s.u||"");
  if(lm){try{const j=await jf("https://api.laut.fm/station/"+(lm[2]||lm[1]),7000);const im=j&&j.images&&(j.images.station||j.images.station_640x640);if(/^https:\/\//.test(im||""))return im}catch(e){}}
  /* по адресу потока: как есть, с другой схемой (http/https) и без параметров; дальше пробуем, только если каталог ответил пустым списком */
  const vs=[s.u],alt=s.u.replace(/^https?:/i,m=>/^https/i.test(m)?"http:":"https:"),bare=s.u.split(/[?#]/)[0];
  if(!vs.includes(alt))vs.push(alt);if(!vs.includes(bare))vs.push(bare);
  for(const v of vs){
    try{const r=await rb("/json/stations/byurl?url="+encodeURIComponent(v));const f=(r||[]).map(ok).find(Boolean);if(f)return f}catch(e){break}
  }
  try{
    const r=await rb("/json/stations/search?limit=15&hidebroken=true&order=clickcount&reverse=true&name="+encodeURIComponent(s.n));
    const n=nrm(s.n),c=(r||[]).filter(ok);
    const best=c.find(x=>nrm(x.name)===n)||c.find(x=>{const m=nrm(x.name);return m&&n&&(m.includes(n)||n.includes(m))});
    if(best)return best.favicon;
  }catch(e){}
  return "";
}
async function loadLogos(all,onProg){
  if(lgBusy)return{busy:true,total:0,found:0};
  const list=stations.filter(s=>!s.l&&(all||!noLg.has(s.u)));
  if(!list.length)return{total:0,found:0};
  lgBusy=true;let i=0,done=0,found=0;
  const worker=async()=>{
    while(i<list.length){
      const s=list[i++];const f=await findLogo(s);
      if(f){if(!s.l){s.l=f;found++}noLg.delete(s.u)}else noLg.add(s.u);
      done++;if(onProg)onProg(done,list.length,found);
      if(f&&view!=="set"&&view!=="skins"){persist();render();renderNP()}
    }
  };
  try{await Promise.all([0,1,2,3].map(worker))}finally{lgBusy=false}
  persist();save("nolg",[...noLg]);
  if(view!=="set"&&view!=="skins")render();renderNP();
  return{total:list.length,found};
}

/* Значок играющей станции подгружается сразу, как только станция включена (не ждём общего поиска логотипов):
   пока в потоке нет обложки трека, и мини-плеер, и основной плеер показывают именно его */
const lgTry=new Map(),lgFlight=new Map();
function ensureLogo(s,force){
  if(!s||(s.l&&!force))return Promise.resolve();
  if(lgFlight.has(s.u))return lgFlight.get(s.u);
  const now=Date.now();
  if(!force&&lgTry.has(s.u)&&now-lgTry.get(s.u)<600000)return Promise.resolve(); // не чаще раза в 10 минут
  lgTry.set(s.u,now);
  const pr=findLogo(s).then(f=>{
    if(f&&!s.l){s.l=f;noLg.delete(s.u);persist();render();renderNP()}
  }).catch(()=>{}).then(()=>{lgFlight.delete(s.u)});
  lgFlight.set(s.u,pr);return pr;
}

  d.classList.add("on");
  d.onclick=e=>{if(e.target===d)closeModal()};
  $("#mc").onclick=closeModal;
  $("#mf").onsubmit=e=>{
    e.preventDefault();
    const f=new FormData(e.target),n=f.get("n").trim(),u=f.get("u").trim(),g=f.get("g").trim(),l=f.get("l").trim()||logoData;
    if(!n||!/^https?:\/\//i.test(u)){alert("Укажите название и ссылку вида http(s)://…");return}
    if(l&&!/^(https?:\/\/|data:image\/)/i.test(l)){alert("Ссылка на логотип должна начинаться с http(s)://");return}
    if(stations.some((x,j)=>j!==i&&x.u===u)){alert("Станция с таким URL уже есть");return}
    if(i<0){stations.push({n,u,g,l});persist();closeModal();render();return}
    const old=s.u;
    if(u!==old&&favs.has(old)){favs.delete(old);favs.add(u)}
    if(S.last===old)S.last=u;
    stations[i]={n,u,g,l};persist();closeModal();render();
    if(i===cur){if(u!==old)playIdx(i);else{renderNP();updMS()}}
  };
  const fe=$("#mf").elements;
  const prev=()=>{const l=fe.l.value.trim()||logoData;$("#lgp").innerHTML=esc((fe.n.value||"?")[0])+(l?`<img src="${esc(l)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:"")};
  prev();
  fe.n.oninput=prev;
  fe.l.oninput=()=>{logoData="";prev()};
  $("#lgx").onclick=()=>{fe.l.value="";logoData="";prev()};
  $("#lgf").onclick=()=>$("#lgi").click();
  $("#lgi").onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const w=img.width||128,h=img.height||128,k=Math.min(1,128/Math.max(w,h));
      const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      logoData=c.toDataURL("image/png");fe.l.value="";URL.revokeObjectURL(url);prev();
    };
    img.onerror=()=>{URL.revokeObjectURL(url);alert("Не удалось прочитать изображение")};
    img.src=url;e.target.value="";
  };
  const first=d.querySelector("input");if(first)first.focus();
}
function delStation(i){
  const s=stations[i];if(!s||!confirm("Удалить станцию «"+s.n+"»?"))return;
  favs.delete(s.u);
  if(i===cur){if(NATIVE)nat("pause");audio.pause();audio.removeAttribute("src");audio.load();stopMeta();meta="";cur=-1;playing=false;closeFP()}
  else if(i<cur)cur--;
  if(S.last===s.u)S.last=null;
  stations.splice(i,1);persist();render();renderNP();
}
/* долгое нажатие на иконку */
document.addEventListener("pointerdown",e=>{
  if(!e.target.closest("#cm"))closeMenu();
  const ic=e.target.closest(".st .ic");if(!ic||e.button>0)return;
  const c=ic.closest(".st");if(c.dataset.i===undefined)return;
  lpFired=false;lpX=e.clientX;lpY=e.clientY;clearTimeout(lpT);
  lpT=setTimeout(()=>{lpFired=true;if(curMode()==="tv"){const i=+c.dataset.i;if(i!==cur)playIdx(i);openFP()}else openMenu(+c.dataset.i,lpX,lpY)},550);
},true);
document.addEventListener("pointermove",e=>{if(lpT&&Math.hypot(e.clientX-lpX,e.clientY-lpY)>10){clearTimeout(lpT);lpT=null}});
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,()=>{clearTimeout(lpT);lpT=null;setTimeout(()=>{lpFired=false},120)}));
/* правый клик */
document.addEventListener("contextmenu",e=>{
  const c=e.target.closest(".st");
  if(c&&c.dataset.i!==undefined){e.preventDefault();openMenu(+c.dataset.i,e.clientX,e.clientY)}
});
/* Enter / OK на пульте: короткое — запуск, долгое — меню */
document.addEventListener("keydown",e=>{
  const a=document.activeElement;
  if(e.key==="Enter"&&a&&a.classList&&a.classList.contains("st")&&a.dataset.i!==undefined){
    e.preventDefault();if(e.repeat)return;enterLong=false;clearTimeout(enterT);
    enterT=setTimeout(()=>{enterLong=true;if(curMode()==="tv"){const i=+a.dataset.i;if(i!==cur)playIdx(i);openFP()}else openMenu(+a.dataset.i,a)},600);
  }
});
document.addEventListener("keyup",e=>{
  if(e.key!=="Enter"||enterT===null)return;
  clearTimeout(enterT);enterT=null;
  if(enterLong){enterLong=false;return}
  const a=document.activeElement;if(a&&a.classList&&a.classList.contains("st"))a.click();
});
function refocus(){
  if(curMode()!=="tv")return;
  const a=document.activeElement;if(a&&a.blur)a.blur();
  tvRestore(lastI);
}

/* ---------- Android TV: навигация пультом ---------- */
function tvRestore(keepI){
  if(curMode()!=="tv")return;
  const a=document.activeElement;
  if(a&&a!==document.body&&document.body.contains(a)&&a.getClientRects().length)return;
  if($("#md.on")||$("#fp.on")||$("#cm").style.display==="block")return;
  const m=$("#main");
  const t=(keepI!=null&&m.querySelector('.st[data-i="'+keepI+'"]'))||m.querySelector(".st,button,input");
  if(t)t.focus();
}
let tvBackTile=null;
function tvFocus(k){
  const scope=$("#md.on")||($("#cm").style.display==="block"?$("#cm"):null)||$("#pw.on")||$("#fp.on")||document.body;
  const els=[...scope.querySelectorAll("button:not([disabled]),.st,input,select,iframe#pwf,#pwslot.vk iframe"),...(scope.id==="pw"&&scope.classList.contains("docked")?document.querySelectorAll("#player button:not([disabled])"):[])].filter(el=>el.getClientRects().length&&!el.closest("#fp:not(.on)")&&!(scope===document.body&&el.classList.contains("fv")));
  const a=document.activeElement;
  if(!els.includes(a)){const f=els.find(x=>x.classList.contains("st"))||els[0];if(f)f.focus();return}
  const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  /* MotoRadio: с плитки у правого края «вправо» — сразу к «Пуск» мини-плеера, «вверх» оттуда — обратно к плитке */
  if(scope===document.body){
    if(k==="ArrowRight"&&a.classList.contains("st")&&a.closest("#main")&&!els.some(el=>el!==a&&el.classList.contains("st")&&Math.abs(el.getBoundingClientRect().top-r.top)<r.height/2&&el.getBoundingClientRect().left>r.left+4)){
      const pp=$("#pp");if(pp&&pp.getClientRects().length){tvBackTile=a;pp.focus();return}
    }
    if(k==="ArrowUp"&&a.closest("#player")&&tvBackTile&&tvBackTile.isConnected&&tvBackTile.getClientRects().length){
      const tb=tvBackTile;tvBackTile=null;tb.focus();tb.scrollIntoView({block:"nearest"});return;
    }
  }
  let best=null,bs=1e9;
  for(const el of els){
    if(el===a)continue;
    const q=el.getBoundingClientRect(),x=q.left+q.width/2-cx,y=q.top+q.height/2-cy;
    let d,o;
    if(k==="ArrowRight"){d=x;o=Math.abs(y)}else if(k==="ArrowLeft"){d=-x;o=Math.abs(y)}
    else if(k==="ArrowDown"){d=y;o=Math.abs(x)}else{d=-y;o=Math.abs(x)}
    if(d<=4)continue;
    const sc=d+o*2.5;if(sc<bs){bs=sc;best=el}
  }
  if(best){best.focus();best.scrollIntoView({block:"nearest",inline:"nearest"})}
}
document.addEventListener("keydown",e=>{
  if(curMode()!=="tv")return;
  const k=e.key,t=e.target;
  if(k.startsWith("Arrow")){
    if(t.tagName==="SELECT")return;
    if(t.tagName==="INPUT"&&t.type==="range"){
      /* ползунок не «залипает»: стрелки переходят дальше; OK включает режим регулировки */
      if(t.dataset.adj){
        if(k==="ArrowLeft"||k==="ArrowRight")return;
        delete t.dataset.adj;
      }
    }else if(t.tagName==="INPUT"&&(k==="ArrowLeft"||k==="ArrowRight"))return;
    e.preventDefault();e.stopImmediatePropagation();tvFocus(k);
  }else if(t.tagName==="INPUT"&&t.type==="range"&&(k==="Enter"||k==="Escape"||k==="GoBack"||k==="BrowserBack")){
    if(t.dataset.adj){delete t.dataset.adj;e.preventDefault();e.stopImmediatePropagation()}
    else if(k==="Enter"){t.dataset.adj="1";e.preventDefault();e.stopImmediatePropagation();try{toast("← → — регулировать, OK — готово")}catch(_){}}
  }
},true);
document.addEventListener("focusout",e=>{if(e.target.dataset&&e.target.dataset.adj)delete e.target.dataset.adj},true);

/* MotoRadio: режим «Случайная» — при каждой смене трека включается случайная станция.
   В приложении Android станцию переключает сам плеер (работает и с выключенным экраном), здесь — в браузере.
   Станции без названий треков в этом режиме не переключаются. */
function shufUi(){const p=$("#psh");if(p)p.classList.toggle("shon",!!S.shufTrk);const f=$("#fsh");if(f)f.classList.toggle("shon",!!S.shufTrk)}
/* MotoRadio: кнопка «Случайная» просто включает случайную станцию; по смене трека станции больше не переключаются */
function toggleShuf(){
  if(S.shufTrk){S.shufTrk=false;persist();shufUi();if(NATIVE)nat("setShuffleMode",false)}
  randomStation();
}
let shKey="",shAt=0;
function shufCheck(){
  const k=cur+"|"+(meta||"");if(k===shKey)return;
  const was=shKey;shKey=k;
  if(!was.startsWith(cur+"|")){shAt=Date.now();return}
  if(NATIVE||!S.shufTrk||locOn()||!playing||!meta||was.endsWith("|"))return;
  if(Date.now()-shAt<20000)return; /* только что переключились — не прыгаем дальше */
  shAt=Date.now();randomStation();
}
function randomStation(){const n=stations.length;if(n<2)return;let i;do{i=Math.floor(Math.random()*n)}while(i===cur);playIdx(i)}
/* Android TV: обложка мини-плеера остаётся слева, а окно с названием и кнопки — ровно по центру полосы */
function tvBar(){
  const p=$("#player"),st=$("#player .stg");if(!p||!st)return;
  const b=p.getBoundingClientRect(),s=st.getBoundingClientRect(),k=s.width/620||1;
  const x=Math.round(((b.left+b.width/2)-s.left)/k-411);
  p.style.setProperty("--tvx",Math.max(0,x)+"px");
}
window.addEventListener("resize",()=>{if(curMode()==="tv")sizeBar()});
function sizeBar(){
  const p=$("#player");if(!p)return;
  const m=curMode();
  if(m==="tv"){
    /* Android TV: мини-плеер внизу подгоняется по ширине и размеру под экран */
    const u=tvScale();let q=1;
    const set=()=>{p.style.setProperty("--pu",(u*q).toFixed(3));p.style.setProperty("--k",(.85*u*q).toFixed(3))};
    set();
    p.style.removeProperty("--tvx");
    for(let i=0;i<20&&q>.3&&p.scrollWidth>p.clientWidth+1;i++){q*=.94;set()}
    tvBar();fitFP();return;
  }
  p.style.removeProperty("--pu");p.style.removeProperty("--tvx");
  if(m==="phone"){
    // размеры берём из реальной раскладки (а не из innerWidth, который при повороте экрана может ещё не обновиться)
    const de=document.documentElement,W=de.clientWidth||innerWidth,H=de.clientHeight||innerHeight;
    let k=Math.min(.8,(W-12)/620);
    if(W>H)k=Math.min(k,.66,H*.36/214); // экран повёрнут: плеер не выше трети экрана
    p.style.setProperty("--k",k.toFixed(3));
  }else p.style.removeProperty("--k");
}
window.addEventListener("resize",sizeBar);
/* При повороте экрана размеры пересчитываются несколько раз: после поворота раскладка обновляется с задержкой */
window.addEventListener("orientationchange",()=>{[60,300,800].forEach(t=>setTimeout(sizeBar,t))});
try{if(window.ResizeObserver)new ResizeObserver(()=>{if(curMode()==="phone")sizeBar()}).observe(document.documentElement)}catch(e){}
try{if(window.visualViewport)visualViewport.addEventListener("resize",()=>{if(curMode()==="phone")sizeBar()})}catch(e){}
$("#part").onclick=openFP;
$("#prp").onclick=()=>{if(cur>=0)playIdx(cur)};
$("#psh").onclick=toggleShuf;
$("#dl").onclick=toggleRec;


/* ---------- состояние от нативного плеера (Android) ---------- */
window.nativeState=function(st){
  if(!st)return;
  const ci=cur;
  if(st.index>=0&&st.index<stations.length)cur=st.index;
  playing=!!st.playing;want=playing;
  if(playing&&locOn()&&!laud.paused)plcStop(true); /* радио включили с уведомления или виджета */
  const raw=st.raw||"";
  if(raw!==meta){meta=raw;trk={a:st.artist||"",t:st.title||"",c:st.cover||"",s:st.cover||""};if(raw&&playing)histAdd()}
  else if(st.cover&&!trk.c){trk.c=st.cover;trk.s=st.cover}
  metaState=raw?"ok":(playing&&(st.since||0)>12?"none":"load");
  renderNP(st.error||undefined);
  if(ci!==cur)render();
};

/* ---------- ориентация экрана ---------- */
function applyOrient(){
  const o=S.orient||"auto";
  if(NATIVE){nat("setOrientation",o);return}
  try{
    if(!screen.orientation)return;
    if(o==="auto")screen.orientation.unlock();
    else if(document.fullscreenElement)screen.orientation.lock(o).catch(()=>{});
  }catch(e){}
}
document.addEventListener("fullscreenchange",applyOrient);

/* ---------- init ---------- */
applyTheme();setVol(S.vol);applyOrient();
if(S.resume&&S.last){cur=stations.findIndex(s=>s.u===S.last)}
renderNP();render();
/* метка «идёт прокрутка» (см. html.scr в стилях) */
(()=>{let t=0;const m=document.getElementById("main");if(!m)return;m.addEventListener("scroll",()=>{if(!t)document.documentElement.classList.add("scr");clearTimeout(t);t=setTimeout(()=>{t=0;document.documentElement.classList.remove("scr")},180)},{passive:true})})();
if(cur>=0||landPhone())openFP();
shufUi();
if(NATIVE){persist();nat("setCoverMode",S.coverMode);nat("setShuffleMode",!!S.shufTrk);try{window.nativeState(JSON.parse(Android.getState()||"null"))}catch(e){}}
setTimeout(()=>{if(cur>=0)ensureLogo(stations[cur])},400);
setTimeout(()=>loadLogos(false),1500);
</script>
